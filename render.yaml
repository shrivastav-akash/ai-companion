services:
  - type: web
    name: ai-companion-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w @companion/shared && npm run build -w @companion/server
    startCommand: npm run db:migrate && node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: WEB_ORIGIN
        sync: false
